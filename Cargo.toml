[package]
name = "ghostpad"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A quiet, local wireless trackpad for Linux"
repository = "https://github.com/dmesgus/ghostpad"
readme = "README.md"
publish = false

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
