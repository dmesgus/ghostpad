name: Draft release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/check.yml

  package:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      RUSTUP_TOOLCHAIN: stable
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev desktop-file-utils
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --offline --locked && make build
      - name: Match tag and package version
        run: |
          version=$(./target/release/ghostpad --version)
          test "$RELEASE_TAG" = "v${version#Ghostpad }"
      - run: python3 scripts/package-release.py --binary target/release/ghostpad --target "${{ matrix.target }}"
      - name: Smoke-test the actual archive without input privileges
        run: python3 tests/release-smoke.py dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostpad-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ghostpad-*
          path: dist
          merge-multiple: true
      - name: Create or update a draft preview only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            test "$(cat "$RUNNER_TEMP/release-is-draft")" = true
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Ghostpad $RELEASE_TAG" --notes-file docs/release-notes.md dist/*.tar.gz dist/*.sha256
          fi
